<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #fcfcfc url('https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/72ba7ef5-3750-4ce6-a896-aae05573ef33/DSC07042-HDR.jpg') center center / cover no-repeat;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: auto;
            margin-top: 50px;
        }

 .contact-card {
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(4px);
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  width: 100%;
  max-width: 450px;
}

.contact-card h1 {
  text-align: center;
  margin-bottom: 20px;
  font-weight: bold;
}

.btn-primary {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  font-weight: 600;
}

.site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      padding: 15px 40px;
      border-bottom: 8px solid #205068; 
    }


    .nav-menu {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px; 
    }


    .nav-menu a {
      text-decoration: none;
      color: #333333;
      font-size: 14px;
      font-weight: 500;
      padding-bottom: 4px;
    }


    .nav-menu a.active {
      border-bottom: 2px solid #205068;
    }


    .portal-btn {
      display: inline-block;
      background-color: #205068; 
      color: #ffffff; 
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
      padding: 14px 28px;
      border-radius: 50px; 
      transition: opacity 0.2s ease;
    }


    .portal-btn:hover {
      opacity: 0.9;
    }

 .portal-btn {
      display: inline-block;
      background-color: #205068; 
      color: #ffffff; 
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
      padding: 14px 28px;
      border-radius: 50px; 
      transition: opacity 0.2s ease;
    }


    .portal-btn:hover {
      opacity: 0.9;
    }

    .nav-menu a:hover { 
      color: #205068; 
    }
    
  .nav-menu a {
  position: relative;
  text-decoration: none;
  color: #333333;
  padding-bottom: 6px;
}
.nav-menu a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0%; 
  height: 2px;
  background-color: #164e63; 
  transition: width 0.3s ease; 
}

.nav-menu a:hover::after,
.nav-menu a.active::after {
  width: 100%;
}
 @media (max-width: 768px) {
            .site-header {
                flex-wrap: wrap;
                gap: 15px;
                padding: 15px 20px;
            }

            .nav-menu {
                order: 3;
                width: 100%;
                flex-wrap: wrap;
                gap: 12px 18px;
            }
        }
  </style>
</head>
<body>

   
  <header class="site-header">
    <div class="logo-area">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpF4ovJ0bEVhY39GUX1UTUw7FmEnIXoB-ksUHLMsDzLg&s=10" alt=" OBMCLogo" class="logo-img" style="width: 120px;height: auto;">
    
    </div>


    <nav class="nav-menu">
      <a href="index.html" class="active">Home</a>
      <a href="page2.html">Courses</a>
      <a href="page3.html">Enroll Now</a>
      <a href="page4.html">Contact Us</a>
      <a href="page5.html">About Us</a>
    </nav>


    <div class="portal-area">
      <a href="#" class="portal-btn">MY PORTAL</a>
    </div>
  </header>


    </style>
</head>
<body>
    <div class="container mt-3">
        <h2>Contact Us</h2>
        <form>
            <div class="mb-3 mt-3">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
            </div>
            <div class="mb-3">
                <label for="phone">Phone Number:</label>
                <input type="text" class="form-control" id="phone" placeholder="Enter phone number" name="phone">
            </div>
            <div class="form-check mb-3">
                <label class="form-check-label">
                    <input class="form-check-input" type="checkbox" name="Contact"> Contact
                </label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
