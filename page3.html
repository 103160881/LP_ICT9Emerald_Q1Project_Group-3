<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll Now | OBMC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f6f9;
            color: #0B2545;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            padding: 15px 40px;
            border-bottom: 8px solid #205068;
        }

        .nav-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .nav-menu a {
            position: relative;
            color: #333333;
            font-size: 14px;
            font-weight: 500;
            padding-bottom: 6px;
            text-decoration: none;
        }

        .nav-menu a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: #164e63;
            transition: width 0.3s ease;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            color: #205068;
        }

        .nav-menu a:hover::after,
        .nav-menu a.active::after {
            width: 100%;
        }

        .portal-btn {
            display: inline-block;
            background-color: #205068;
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 14px 28px;
            border-radius: 50px;
            transition: opacity 0.2s ease;
        }

        .portal-btn:hover {
            opacity: 0.9;
            color: #ffffff;
        }

        .card {
            border-top: 5px solid #0B2545;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
        }

        .form-label {
            font-weight: 600;
            color: #0B2545;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0B2545;
            box-shadow: 0 0 0 .25rem rgba(11,37,69,.25);
        }

        .btn-obmc {
            background: #0B2545;
            color: #fff;
            font-weight: 600;
            transition: .2s;
        }

        .btn-obmc:hover {
            background: #E6A100;
            color: #0B2545;
        }

        @media (max-width: 768px) {
            .site-header {
                flex-wrap: wrap;
                gap: 15px;
                padding: 15px 20px;
            }

            .nav-menu {
                order: 3;
                width: 100%;
                flex-wrap: wrap;
                gap: 12px 18px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo-area">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpF4ovJ0bEVhY39GUX1UTUw7FmEnIXoB-ksUHLMsDzLg&s=10" alt="OBMC Logo" class="logo-img" style="width: 120px; height: auto;">
        </div>

        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="page2.html">Courses</a>
            <a href="page3.html" class="active">Enroll Now</a>
            <a href="page4.html">Contact Us</a>
            <a href="page5.html">About Us</a>
        </nav>

        <div class="portal-area">
            <a href="#" class="portal-btn">MY PORTAL</a>
        </div>
    </header>

    <main class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
        <div class="card shadow p-4 mx-auto">
            <h1 class="text-center mb-4 fw-bold">Inquiry</h1>
            <form>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">First Name <span class="text-muted fw-normal">(required)</span></label>
                        <input type="text" class="form-control" id="firstName" name="first_name" required>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Last Name <span class="text-muted fw-normal">(required)</span></label>
                        <input type="text" class="form-control" id="lastName" name="last_name" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone <span class="text-muted fw-normal">(required)</span></label>
                    <input type="tel" class="form-control" id="phone" name="phone" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email <span class="text-muted fw-normal">(required)</span></label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="inquiry" class="form-label">Inquiry <span class="text-muted fw-normal">(required)</span></label>
                    <select class="form-select" id="inquiry" name="inquiry" required>
                        <option value="" disabled selected>Select an option</option>
                        <option value="Casa">Casa</option>
                        <option value="Primary">Primary</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Junior High School">Junior High School</option>
                        <option value="Senior High School">Senior High School</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" id="message" name="message" rows="4"></textarea>
                </div>

                <button type="submit" class="btn btn-obmc w-100 py-2">Submit</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
